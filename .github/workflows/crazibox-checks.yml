name: Crazibox checks

on:
  push:
    branches:
      - bigjude-customization
  pull_request:
    branches:
      - main
      - bigjude-customization

concurrency:
  group: crazibox-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python extractors
        run: python -m pip install -r backend/requirements.txt

      - name: Build frontend
        run: npm run build

      - name: Build production Docker image
        run: docker build --pull -t crazibox:ci .

      - name: Smoke-test production container
        run: |
          set -euo pipefail
          docker run -d --name crazibox-ci -p 127.0.0.1:18080:10000 crazibox:ci
          trap 'docker logs crazibox-ci; docker rm -f crazibox-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health >/tmp/crazibox-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/crazibox-health.json
          curl --fail --silent http://127.0.0.1:18080/ | grep -q 'Crazibox'

      - name: Run backend tests
        run: npm test

      - name: Test Instagram adapter
        run: python backend/python/test_instagram.py

      - name: Test X adapter
        run: python backend/python/test_twitter.py
